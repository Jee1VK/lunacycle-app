name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web bundle with OTA version stamp
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          npm run build
          printf '{"version":"%s","builtAt":"%s"}\n' "$VITE_APP_VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Notification, Biometric & Network Permissions in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n\n    <application|' "$MANIFEST"
          fi

      - name: Embed Custom LunaCycle App Icon Across Android Mipmaps
        run: |
          python3 - << 'EOF'
          import os, shutil

          res_dir = "android/app/src/main/res"
          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.isdir(anydpi):
              shutil.rmtree(anydpi)

          for bucket in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              d = os.path.join(res_dir, bucket)
              os.makedirs(d, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  shutil.copyfile("public/icon-512.png", os.path.join(d, name))
          EOF

      - name: Configure Permanent Release Signing & Auto-Incrementing Version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/lunacycle-release.jks
          python3 - << 'EOF'
          import os, re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              text = f.read()
          run_num = os.environ["RUN_NUMBER"]
          text = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', text)
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("lunacycle-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release"""
          text = text.replace("    buildTypes {\n        release {", signing_block, 1)
          with open(path, "w") as f:
              f.write(text)
          EOF

      - name: Build Signed Release Android APK (Gradle)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../LunaCycle.apk

      - name: Upload LunaCycle APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaCycle-Android-APK
          path: LunaCycle.apk
          retention-days: 30

      - name: Auto-Publish Latest GitHub Release (LunaCycle.apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest LunaCycle.apk --clobber
          else
            gh release create latest LunaCycle.apk \
              --title "LunaCycle (Latest Android APK)" \
              --notes "Signed Android APK for LunaCycle with built-in PWA-style Over-The-Air (OTA) live updates. Future web updates apply automatically without reinstalling."
          fi
