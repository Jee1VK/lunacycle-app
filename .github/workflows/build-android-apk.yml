name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web bundle with OTA version stamp
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          npm run build
          printf '{"version":"%s","builtAt":"%s"}\n' "$VITE_APP_VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Notification, Biometric & Network Permissions in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n\n    <application|' "$MANIFEST"
          fi

      - name: Configure Android App Icon Long-Press Shortcuts
        run: |
          python3 - << 'EOF'
          import os

          values_dir = "android/app/src/main/res/values"
          xml_dir = "android/app/src/main/res/xml"
          os.makedirs(values_dir, exist_ok=True)
          os.makedirs(xml_dir, exist_ok=True)

          strings_xml = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="shortcut_period_short">Log Period</string>
            <string name="shortcut_period_long">Log Period Today</string>
            <string name="shortcut_pill_short">Take Pill</string>
            <string name="shortcut_pill_long">Mark Pill Taken</string>
            <string name="shortcut_symptoms_short">Symptoms</string>
            <string name="shortcut_symptoms_long">Log Symptoms</string>
          </resources>
          """
          with open(os.path.join(values_dir, "shortcut_strings.xml"), "w", encoding="utf-8") as f:
              f.write("\n".join(line.lstrip() for line in strings_xml.strip().splitlines()) + "\n")

          shortcuts_xml = """<?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
            <shortcut
              android:shortcutId="log_period"
              android:enabled="true"
              android:icon="@mipmap/ic_launcher"
              android:shortcutShortLabel="@string/shortcut_period_short"
              android:shortcutLongLabel="@string/shortcut_period_long">
              <intent
                android:action="android.intent.action.VIEW"
                android:targetPackage="com.lunacycle.app"
                android:targetClass="com.lunacycle.app.MainActivity"
                android:data="https://jee1vk.github.io/lunacycle-app/?action=log-period" />
            </shortcut>
            <shortcut
              android:shortcutId="take_pill"
              android:enabled="true"
              android:icon="@mipmap/ic_launcher"
              android:shortcutShortLabel="@string/shortcut_pill_short"
              android:shortcutLongLabel="@string/shortcut_pill_long">
              <intent
                android:action="android.intent.action.VIEW"
                android:targetPackage="com.lunacycle.app"
                android:targetClass="com.lunacycle.app.MainActivity"
                android:data="https://jee1vk.github.io/lunacycle-app/?action=take-pill" />
            </shortcut>
            <shortcut
              android:shortcutId="log_symptoms"
              android:enabled="true"
              android:icon="@mipmap/ic_launcher"
              android:shortcutShortLabel="@string/shortcut_symptoms_short"
              android:shortcutLongLabel="@string/shortcut_symptoms_long">
              <intent
                android:action="android.intent.action.VIEW"
                android:targetPackage="com.lunacycle.app"
                android:targetClass="com.lunacycle.app.MainActivity"
                android:data="https://jee1vk.github.io/lunacycle-app/?action=log-symptoms" />
            </shortcut>
          </shortcuts>
          """
          with open(os.path.join(xml_dir, "shortcuts.xml"), "w", encoding="utf-8") as f:
              f.write("\n".join(line.lstrip() for line in shortcuts_xml.strip().splitlines()) + "\n")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()
          if "android.app.shortcuts" not in manifest:
              manifest = manifest.replace(
                  "</activity>",
                  '    <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />\n        </activity>',
                  1,
              )
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
          EOF

      - name: Embed Custom LunaCycle App Icon Across Android Mipmaps
        run: |
          python3 - << 'EOF'
          import os, shutil

          res_dir = "android/app/src/main/res"
          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.isdir(anydpi):
              shutil.rmtree(anydpi)

          for bucket in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              d = os.path.join(res_dir, bucket)
              os.makedirs(d, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  shutil.copyfile("public/icon-512.png", os.path.join(d, name))
          EOF

      - name: Configure Permanent Release Signing & Auto-Incrementing Version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/lunacycle-release.jks
          cat > android/keystore.properties << EOF
          storeFile=../lunacycle-release.jks
          storePassword=${ANDROID_KEYSTORE_PASS}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASS}
          EOF
          python3 - << 'EOF'
          import os, re
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          run_num = os.environ["RUN_NUMBER"]
          text = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          EOF

      - name: Build Signed Release Android APK & AAB (Gradle)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../LunaCycle.apk
          cp app/build/outputs/bundle/release/app-release.aab ../LunaCycle.aab

      - name: Upload LunaCycle APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LunaCycle-Android-Builds
          path: |
            LunaCycle.apk
            LunaCycle.aab
          retention-days: 30

      - name: Auto-Publish Latest GitHub Release (LunaCycle.apk & LunaCycle.aab)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest LunaCycle.apk LunaCycle.aab --clobber
          else
            gh release create latest LunaCycle.apk LunaCycle.aab \
              --title "LunaCycle (Latest Android APK & AAB)" \
              --notes "Signed Android APK and Play Store AAB for LunaCycle."
          fi
