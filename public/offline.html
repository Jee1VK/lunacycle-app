<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LunaCycle — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #FAFAF7;
        color: #1C1917;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 360px;
        background: #FFFFFF;
        border: 1px solid #EAE5DC;
        border-radius: 14px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 20px -4px rgba(107, 29, 47, 0.08);
      }
      h1 {
        font-family: Georgia, serif;
        color: #6B1D2F;
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 18px;
        font-size: 0.9rem;
        color: #4B5563;
        line-height: 1.5;
      }
      button {
        min-height: 46px;
        width: 100%;
        border: none;
        border-radius: 6px;
        background: #6B1D2F;
        color: #FFFFFF;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>LunaCycle is Offline</h1>
      <p>
        Connect to the internet once so LunaCycle can cache the latest live version for full offline use.
      </p>
      <button type="button" onclick="window.location.href='https://jee1vk.github.io/lunacycle-app/'">
        Retry Connection
      </button>
    </main>
  </body>
</html>
